<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Online Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Quiz Title -->
        <h1>Online Quiz Application</h1>

<!-- Welcome Screen -->
<div id="category-box">

    <h2>Welcome to the Quiz App</h2>

    <p>
    Test your programming knowledge and improve your skills.
    Choose a category below and begin your learning journey.
</p>
    

    <button onclick="startQuiz('java')">Java</button>

<button onclick="startQuiz('python')">Python</button>

<button onclick="startQuiz('c')">C Language</button>

<button onclick="startQuiz('javascript')">JavaScript</button>

<button onclick="startQuiz('html')">HTML</button>


</div>

<!-- Quiz Box -->
<div id="quiz-box" style="display:none;">

            <!-- Question Number -->
<p id="question-number"></p>
            <!-- Question -->
            <h2 id="question">Question will appear here</h2>

            <!-- Options -->

            <div id="options">
                <button class="option-btn">Option 1</button>
                <button class="option-btn">Option 2</button>
                <button class="option-btn">Option 3</button>
                <button class="option-btn">Option 4</button>
            </div>

            <div class="navigation-buttons">

    <button id="prev-btn">
        Previous
    </button>

    <button id="next-btn">
        Next
    </button>

</div>
        </div>

        <!-- Result Section -->
       <div id="result-box" style="display:none;">

    <h2 id="result-message"></h2>

    <p id="user-score"></p>

    <h3>Would you like to try another category?</h3>

    <button id="yes-btn">Yes</button>

    <button id="no-btn">No</button>

</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
